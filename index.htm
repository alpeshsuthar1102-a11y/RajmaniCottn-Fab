<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajmani Shop - Complete E-Commerce</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}

/* HEADER */
header{
background:#0d1b3e;
color:white;
padding:15px;
text-align:center;
}

h1{color:#d4af37}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

button{
padding:10px;
border:none;
border-radius:50px;
cursor:pointer;
width:100%;
}

.add{background:#0d1b3e;color:white;margin-top:5px}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:320px;
height:100%;
background:white;
box-shadow:-5px 0 15px rgba(0,0,0,.2);
padding:15px;
overflow:auto;
}

.pay{background:#25D366;color:white;margin-top:10px}

/* PAYMENT */
.payment{
display:none;
text-align:center;
padding:20px;
}

footer{
text-align:center;
padding:20px;
background:#071126;
color:white;
}

</style>
</head>

<body>

<header>
<h1>RAJMANI SHOP 🛍️</h1>
</header>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- CART -->
<div class="cart">
<h2>Cart 🛒</h2>
<div id="cartItems"></div>
<h3 id="total"></h3>

<button class="pay" onclick="openPayment()">
Proceed to Payment
</button>
</div>

<!-- PAYMENT PAGE -->
<div class="payment" id="payment">

<h2>Payment Page 💳</h2>

<h3>Pay via UPI</h3>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9687286173@upi&pn=RajmaniShop">

<p>UPI ID: 9687286173@upi</p>

<button onclick="confirmPayment()" style="background:#25D366;color:white;margin-top:10px;">
I Have Paid
</button>

</div>

<footer>© 2026 Rajmani Shop</footer>

<script>

/* PRODUCTS */
let products = [
{name:"Premium Suiting", price:500, img:"shop1.jpeg"},
{name:"Designer Shirting", price:700, img:"shop2.jpeg"},
{name:"Wedding Fabric", price:1200, img:"shop3.jpeg"}
];

let cart = [];

/* LOAD PRODUCTS */
function load(){

let html="";

products.forEach((p,i)=>{

html+=`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<p>₹ ${p.price}</p>

<button class="add" onclick="add(${i})">
Add to Cart
</button>

</div>
`;
});

document.getElementById("products").innerHTML=html;
}

/* ADD TO CART */
function add(i){
cart.push(products[i]);
updateCart();
}

/* UPDATE CART */
function updateCart(){

let html="";
let total=0;

cart.forEach(c=>{
total+=c.price;
html+=`<p>${c.name} - ₹${c.price}</p>`;
});

document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerText="Total: ₹"+total;
}

/* PAYMENT */
function openPayment(){
document.getElementById("payment").style.display="block";
}

function confirmPayment(){

let msg="Order Paid:%0A";

cart.forEach(c=>{
msg+=`- ${c.name} ₹${c.price}%0A`;
});

window.open("https://wa.me/919687286173?text="+encodeURIComponent(msg));

alert("Payment Successful 🎉");
}

/* INIT */
load();
updateCart();

</script>

</body>
</html>
