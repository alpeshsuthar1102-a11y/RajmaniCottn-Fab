<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajmani Shop Video Website</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

/* HEADER */
header{
background:#0d1b3e;
color:white;
text-align:center;
padding:15px;
}

h1{
color:#d4af37;
margin:0;
}

/* SLIDER */
.slider{
width:100%;
height:300px;
overflow:hidden;
}

.slider img{
width:100%;
height:300px;
object-fit:cover;
}

/* VIDEO */
video{
width:100%;
height:300px;
object-fit:cover;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.card h3{
margin:10px;
}

.card p{
margin:0 10px;
color:green;
font-weight:bold;
}

button{
width:100%;
padding:10px;
border:none;
background:#0d1b3e;
color:white;
cursor:pointer;
}

/* FOOTER */
footer{
text-align:center;
padding:15px;
background:#071126;
color:white;
margin-top:20px;
}

</style>
</head>

<body>

<header>
<h1>RAJMANI SHOP 🛍️</h1>
<p>Video + Slider + Shop Website</p>
</header>

<!-- IMAGE SLIDER -->
<div class="slider">
<img id="slide" src="shop1.jpeg">
</div>

<!-- VIDEO -->
<video autoplay muted loop>
<source src="shop-video.mp4" type="video/mp4">
</video>

<!-- PRODUCTS -->
<h2 style="text-align:center;">Products</h2>

<div class="products">

<div class="card">
<img src="shop1.jpeg">
<h3>Premium Suiting</h3>
<p>₹500</p>
<button onclick="order('Premium Suiting',500)">Order Now</button>
</div>

<div class="card">
<img src="shop2.jpeg">
<h3>Designer Shirting</h3>
<p>₹700</p>
<button onclick="order('Designer Shirting',700)">Order Now</button>
</div>

<div class="card">
<img src="shop3.jpeg">
<h3>Wedding Fabric</h3>
<p>₹1200</p>
<button onclick="order('Wedding Fabric',1200)">Order Now</button>
</div>

<div class="card">
<img src="shop4.jpeg">
<h3>Cotton Fabric</h3>
<p>₹400</p>
<button onclick="order('Cotton Fabric',400)">Order Now</button>
</div>

</div>

<footer>
© 2026 Rajmani Shop | All Rights Reserved
</footer>

<script>

/* IMAGE SLIDER */
let images = [
"shop1.jpeg",
"shop2.jpeg",
"shop3.jpeg",
"shop4.jpeg",
"shop5.jpeg"
];

let i = 0;

setInterval(()=>{
i = (i + 1) % images.length;
document.getElementById("slide").src = images[i];
},2000);

/* WHATSAPP ORDER */
function order(name,price){

let msg =
"Hello Rajmani Shop%0A" +
"I want to order:%0A" +
"- " + name + " (₹" + price + ")";

window.open(
"https://wa.me/919687286173?text=" + encodeURIComponent(msg),
"_blank"
);

}

</script>

</body>
</html>
