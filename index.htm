<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajmani Shop</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

header{
background:#0d1b3e;
color:white;
text-align:center;
padding:15px;
}

h1{
color:#d4af37;
margin:0;
font-size:24px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.card h3{
margin:10px;
font-size:16px;
}

.card p{
margin:0 10px 10px;
color:green;
font-weight:bold;
}

footer{
text-align:center;
padding:15px;
background:#071126;
color:white;
margin-top:10px;
}

</style>
</head>

<body>

<header>
<h1>RAJMANI SHOP 🛍️</h1>
<p>Tap product to order on WhatsApp</p>
</header>

<div class="products">

<div class="card" onclick="order('Premium Suiting',500)">
<img src="shop1.jpeg">
<h3>Premium Suiting</h3>
<p>₹500</p>
</div>

<div class="card" onclick="order('Designer Shirting',700)">
<img src="shop2.jpeg">
<h3>Designer Shirting</h3>
<p>₹700</p>
</div>

<div class="card" onclick="order('Wedding Fabric',1200)">
<img src="shop3.jpeg">
<h3>Wedding Fabric</h3>
<p>₹1200</p>
</div>

<div class="card" onclick="order('Cotton Fabric',400)">
<img src="shop4.jpeg">
<h3>Cotton Fabric</h3>
<p>₹400</p>
</div>

</div>

<footer>
© 2026 Rajmani Shop | All Rights Reserved
</footer>

<script>

/* WhatsApp order function */
function order(name,price){

let message =
"Hello Rajmani Shop,%0A" +
"I want to order:%0A" +
"- " + name + " (₹" + price + ")";

window.open(
"https://wa.me/919687286173?text=" + message,
"_blank"
);

}

</script>

</body>
</html>
