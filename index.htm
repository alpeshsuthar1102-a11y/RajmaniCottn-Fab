<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajmani Online Shop</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

header{
background:#0d1b3e;
color:white;
text-align:center;
padding:15px;
}

h1{color:#d4af37;margin:0}

/* NAV */
nav{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:10px;
background:white;
}

nav button{
padding:10px;
border:none;
border-radius:20px;
background:#0d1b3e;
color:white;
cursor:pointer;
}

/* SECTIONS */
section{display:none;padding:15px}
.active{display:block}

/* PRODUCTS */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
border-radius:15px;
padding:10px;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
}

.price{color:green;font-weight:bold}

button.action{
width:100%;
padding:10px;
border:none;
background:#0d1b3e;
color:white;
border-radius:10px;
cursor:pointer;
margin-top:5px;
}

/* INPUT */
input,textarea{
width:100%;
padding:10px;
margin:5px 0;
border-radius:10px;
border:1px solid #ccc;
}

/* REVIEW */
.review{
background:white;
padding:10px;
margin:10px 0;
border-radius:10px;
}

/* FOOTER */
footer{
text-align:center;
padding:15px;
background:#071126;
color:white;
}

</style>
</head>

<body>

<header>
<h1>RAJMANI SHOP 🛍️</h1>
</header>

<!-- NAV -->
<nav>
<button onclick="show('shop')">Shop</button>
<button onclick="show('cart')">Cart</button>
<button onclick="show('admin')">Admin</button>
<button onclick="show('review')">Review</button>
</nav>

<!-- SHOP -->
<section id="shop" class="active">
<h2>Products</h2>
<div class="grid" id="products"></div>
</section>

<!-- CART -->
<section id="cart">
<h2>Cart 🛒</h2>
<div id="cartList"></div>
<h3 id="total"></h3>

<button class="action" onclick="checkout()">
Checkout (WhatsApp)
</button>
</section>

<!-- ADMIN -->
<section id="admin">
<h2>Admin Panel 🔐</h2>

<input id="name" placeholder="Product Name">
<input id="price" type="number" placeholder="Price">
<input id="img" placeholder="Image URL (shop1.jpeg)">

<button class="action" onclick="addProduct()">Add Product</button>
</section>

<!-- REVIEW -->
<section id="review">
<h2>Customer Reviews ⭐</h2>

<input id="rname" placeholder="Your Name">
<textarea id="rmsg" placeholder="Your Review"></textarea>

<button class="action" onclick="addReview()">Submit Review</button>

<div id="reviews"></div>
</section>

<footer>
© 2026 Rajmani Shop
</footer>

<script>

/* DATA */
let products = JSON.parse(localStorage.getItem("products")) || [
{name:"Premium Suiting",price:500,img:"shop1.jpeg"},
{name:"Designer Shirting",price:700,img:"shop2.jpeg"}
];

let cart=[];
let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

/* NAV */
function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
render();
}

/* RENDER */
function render(){

/* PRODUCTS */
let phtml="";
products.forEach((p,i)=>{
phtml+=`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<p class="price">₹${p.price}</p>
<button class="action" onclick="add(${i})">Add to Cart</button>
</div>
`;
});
document.getElementById("products").innerHTML=phtml;

/* CART */
let chtml="";
let total=0;

cart.forEach((c,i)=>{
total+=c.price;
chtml+=`<p>${c.name} - ₹${c.price}</p>`;
});

document.getElementById("cartList").innerHTML=chtml;
document.getElementById("total").innerText="Total: ₹"+total;

/* REVIEWS */
let rhtml="";
reviews.forEach(r=>{
rhtml+=`
<div class="review">
<b>${r.name}</b>
<p>${r.msg}</p>
</div>
`;
});
document.getElementById("reviews").innerHTML=rhtml;

}

/* ADD PRODUCT */
function addProduct(){

let n=document.getElementById("name").value;
let p=document.getElementById("price").value;
let i=document.getElementById("img").value;

if(!n||!p||!i){alert("Fill all");return;}

products.push({name:n,price:parseInt(p),img:i});
localStorage.setItem("products",JSON.stringify(products));

alert("Product Added ✅");
render();
}

/* ADD CART */
function add(i){
cart.push(products[i]);
render();
}

/* CHECKOUT */
function checkout(){

let msg="Order:%0A";
let total=0;

cart.forEach(c=>{
msg+=`- ${c.name} ₹${c.price}%0A`;
total+=c.price;
});

msg+=`Total: ₹${total}`;

window.open("https://wa.me/919687286173?text="+encodeURIComponent(msg));

cart=[];
render();
}

/* REVIEW */
function addReview(){

let n=document.getElementById("rname").value;
let m=document.getElementById("rmsg").value;

if(!n||!m){alert("Fill all");return;}

reviews.push({name:n,msg:m});
localStorage.setItem("reviews",JSON.stringify(reviews));

document.getElementById("rname").value="";
document.getElementById("rmsg").value="";

render();
}

/* INIT */
render();

</script>

</body>
</html>
